# Builds the three-volume wiki set once per OrcaSlicer minor version (2.4, 2.5, ...) and attaches the
# PDFs to a GitHub Release in this repo, tagged wiki-<app version>. The policy lives in release_check.py:
# build when a minor has settled (no new patch for 21 days), refresh long-lived minors after 90 days.
#
# The wiki itself has no releases, so the app's stable releases are the version signal.
# A weekly check stands in for a cross-repo subscription, which GitHub doesn't offer.
name: Release wiki books

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays, 05:17 UTC
  workflow_dispatch:
    inputs:
      app_version:
        description: "Build now for this OrcaSlicer tag (e.g. v2.4.2), skipping the cadence rules. Empty = apply them."
        required: false

permissions:
  contents: write   # create releases and upload the PDFs

concurrency:
  group: release-wiki-books
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release_check.py
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.app_version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            printf 'version=%s\nbuild=true\n' "$REQUESTED" >> "$GITHUB_OUTPUT"
          else
            python3 release_check.py
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest   # Edge is preinstalled, so the build matches local runs exactly
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      # Same layout as a local checkout: book/ next to OrcaSlicer_WIKI/
      - uses: actions/checkout@v4
        with:
          path: book
      - uses: actions/checkout@v4
        with:
          repository: OrcaSlicer/OrcaSlicer_WIKI
          path: OrcaSlicer_WIKI

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: book/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: book/package-lock.json

      - name: Install dependencies
        working-directory: book
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Self-check
        working-directory: book
        run: python test_build.py

      - name: Build volumes
        working-directory: book
        run: python build.py -c volumes/*.toml | tee build.log

      - name: Publish release
        working-directory: book
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wiki_commit="$(git -C ../OrcaSlicer_WIKI log -1 --format='%h (%cs)')"
          {
            echo "Printable OrcaSlicer Wiki, built for OrcaSlicer **$VERSION** from wiki commit $wiki_commit."
            echo
            echo "- \`*-imposed.pdf\`: A4 sheets to print double-sided (flip on short edge) and fold into signatures."
            echo "- Other PDFs: A5 reading copies."
            echo
            echo '```'
            grep -E '^out/' build.log
            echo '```'
          } > notes.md
          tag="wiki-$VERSION"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true   # only exists when a manual run repeats a version
          gh release create "$tag" out/*.pdf --title "Wiki books for OrcaSlicer $VERSION" --notes-file notes.md
